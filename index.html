<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0c0d10">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Word Lens">
  <meta name="description" content="Point your camera at a page, tap a word, and read its definition.">
  <title>Word Lens</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="shortcut icon" href="./favicon.ico">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <div id="stage">
      <video id="preview" autoplay muted playsinline webkit-playsinline></video>
      <canvas id="frame" aria-hidden="true"></canvas>
      <div id="boxes" hidden></div>
    </div>

    <div id="start" class="overlay panel">
      <img class="logo" src="./icons/apple-touch-icon.png" width="72" height="72" alt="">
      <h1>Word Lens</h1>
      <p>Point your camera at a page, tap a word, and read the definition.</p>
      <button id="open-camera" type="button" class="primary">Open camera</button>
      <button id="choose-photo" type="button" class="text-btn">Choose a photo instead</button>
      <p id="start-hint" class="hint" hidden></p>
    </div>

    <div id="loading" class="overlay" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <p id="loading-text">Reading words…</p>
    </div>

    <p id="toast" hidden role="status"></p>

    <p id="tap-hint" hidden>Tap a word</p>

    <div id="controls" hidden>
      <button id="shutter" type="button" aria-label="Capture"></button>
      <button id="retake" type="button" hidden>Retake</button>
      <button id="toggle-common" type="button" hidden aria-pressed="false">Show all</button>
    </div>

    <div id="sheet" hidden>
      <div id="sheet-backdrop"></div>
      <div id="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-word">
        <div class="sheet-handle" aria-hidden="true"></div>
        <button id="sheet-close" type="button" aria-label="Close definition">Close</button>
        <h2 id="sheet-word"></h2>
        <p id="sheet-phonetic"></p>
        <div id="sheet-body"></div>
      </div>
    </div>

    <input id="file" type="file" accept="image/*" hidden>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
